name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build:required
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare

      - name: Cache native engine
        id: face-engine
        uses: actions/cache@v5
        with:
          path: apps/context-use/backend/.cache/face-engine-linux
          key: face-engine-linux-amd64-${{ hashFiles('apps/context-use/backend/native/faces/**', 'apps/context-use/backend/scripts/build-faces.ts', 'apps/context-use/backend/scripts/shared/build-assets.ts', 'apps/context-use/backend/scripts/shared/build-target.ts') }}

      - name: Build
        env:
          FACE_ENGINE_CACHE_HIT: ${{ steps.face-engine.outputs.cache-hit }}
        run: bun run build:instance

      - name: Start sync scheduler
        run: |
          sudo apt-get update
          sudo apt-get install -y cron
          sudo systemctl start cron

      - name: Verify compiled instance
        run: bun --filter @repo/context-use test:binary:instance

      - name: Prepare nibrun binary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cp apps/context-use/dist/context-use context-use

      - name: Upload nibrun binary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: nibrun-binary
          path: context-use
          if-no-files-found: error

  publish-nibrun:
    name: publish:nibrun
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nibrun-release
      cancel-in-progress: true
    steps:
      - name: Download nibrun binary
        uses: actions/download-artifact@v8
        with:
          name: nibrun-binary

      - name: Publish rolling nibrun release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nibrun-latest >/dev/null 2>&1; then
            gh release upload nibrun-latest context-use --clobber
            gh release edit nibrun-latest \
              --notes "Built from ${GITHUB_SHA}. This asset is replaced after every successful build on main."
          else
            gh release create nibrun-latest context-use \
              --title "nibrun deployment" \
              --prerelease \
              --notes "Built from ${GITHUB_SHA}. This asset is replaced after every successful build on main."
          fi

  deploy-nibrun:
    name: deploy:nibrun
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.NIBRUN_APP_ID != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: nibrun
      url: ${{ vars.NIBRUN_APP_URL }}
    concurrency:
      group: nibrun-instance
      cancel-in-progress: false
    steps:
      - name: Download tested instance binary
        uses: actions/download-artifact@v8
        with:
          name: nibrun-binary

      - name: Set up nibrun CLI
        uses: nibrunhq/setup-cli@v1.0.1
        with:
          version: '2026.10.14-2'

      - name: Deploy existing instance
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NIBRUN_APP_ID: ${{ vars.NIBRUN_APP_ID }}
        run: |
          latest_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping a build superseded on main."
            exit 0
          fi
          nib run ./context-use --github-trusted-oidc --app-id "$NIBRUN_APP_ID"
