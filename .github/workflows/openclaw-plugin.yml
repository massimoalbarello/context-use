name: openclaw-plugin

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - packages/openclaw-memory/**
      - packages/typescript-config/**
      - package.json
      - bun.lock
      - bunfig.toml
      - LICENSE
      - .bun-version
      - .github/actions/prepare/**
      - .github/workflows/openclaw-plugin.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: packages/openclaw-memory/.node-version
          package-manager-cache: false

      - uses: ./.github/actions/prepare

      - name: Generate release version
        id: version
        run: |
          version=$(node -p 'const p = require("./packages/openclaw-memory/package.json"); `${p.version}-${p.publishConfig.tag}.${process.env.GITHUB_RUN_NUMBER}`')
          npm pkg set version="$version" --prefix packages/openclaw-memory --workspaces=false
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check plugin
        run: |
          bun run --cwd packages/openclaw-memory check:types
          bun run --cwd packages/openclaw-memory test

      - name: Install test browser
        run: bun run --cwd packages/browser-testing playwright install --with-deps chrome

      - name: Package and test the release through real OpenClaw
        run: bun run --cwd packages/openclaw-memory test:e2e

      - uses: actions/upload-artifact@v7
        with:
          name: openclaw-memory-package
          path: packages/openclaw-memory/release/*.tgz
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-openclaw-memory
      queue: max
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: packages/openclaw-memory/.node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: openclaw-memory-package
          path: release

      - uses: ./.github/actions/prepare

      - name: Publish the verified artifact
        id: publish
        # Configure this workflow and the npm environment as the package's trusted
        # publisher. NPM_TOKEN is only needed to bootstrap a package that does not
        # yet exist; remove that secret after configuring trusted publishing.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          artifacts=(release/*.tgz)
          test "${#artifacts[@]}" -eq 1
          bun run packages/openclaw-memory/scripts/publish.ts "${artifacts[0]}"

  verify-published:
    needs: [verify, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: packages/openclaw-memory/.node-version
          package-manager-cache: false

      - uses: ./.github/actions/prepare

      - name: Select the exact published version
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: npm pkg set version="$RELEASE_VERSION" --prefix packages/openclaw-memory --workspaces=false

      - name: Install test browser
        run: bun run --cwd packages/browser-testing playwright install --with-deps chrome

      - name: Wait for npm to serve the published version
        timeout-minutes: 5
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          until npm view "@context-use/openclaw-memory@$RELEASE_VERSION" version --prefer-online --fetch-retries=0; do
            sleep 5
          done

      - name: Install and test the published version through real OpenClaw
        run: bun run --cwd packages/openclaw-memory test:published
