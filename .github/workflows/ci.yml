name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nango_integrations:
    name: Validate Nango integrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
        working-directory: nango-integrations
      - run: bun test
        working-directory: nango-integrations
      - run: bun run typecheck
        working-directory: nango-integrations
      - run: bun run compile
        working-directory: nango-integrations
      - uses: docker/setup-buildx-action@v4
      - name: Build deployer image
        uses: docker/build-push-action@v7
        with:
          context: ./nango-integrations
          file: ./nango-integrations/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=nango-integrations
          cache-to: type=gha,mode=max,scope=nango-integrations

  nango_image:
    name: Build pinned Nango image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - id: source
        name: Resolve pinned Nango source
        run: echo "sha=$(git -C nango rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify deployer CLI compatibility
        run: |
          runtime_cli="$(jq -r .version nango/packages/cli/package.json)"
          deployer_cli="$(jq -r .dependencies.nango nango-integrations/package.json)"
          test "$deployer_cli" = "$runtime_cli"
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: ./nango
          file: ./nango/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: git_hash=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=nango
          cache-to: type=gha,mode=max,scope=nango

  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: context_use
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d context_use"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: 1.11.4 }
      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun run typecheck
      - run: bun --cwd apps/server build
      - run: bun test apps packages
      - name: Apply migrations and verify database roles
        env:
          MIGRATOR_DATABASE_URL: postgres://postgres:postgres@localhost:5432/context_use
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/context_use
          DB_AUTH_PASSWORD: test-auth
          DB_DASHBOARD_PASSWORD: test-dashboard
          DB_MCP_PASSWORD: test-mcp
          DB_PUBLIC_PASSWORD: test-public
          DB_CONFIRMATION_PASSWORD: test-confirmation
          DB_STORAGE_PASSWORD: test-storage
          DB_BACKUP_PASSWORD: test-backup
          TEST_APP_DATABASE_URL: "1"
          DATABASE_URL: postgres://context_use_dashboard:test-dashboard@localhost:5432/context_use
          AUTH_DATABASE_URL: postgres://context_use_auth:test-auth@localhost:5432/context_use
          MCP_DATABASE_URL: postgres://context_use_mcp:test-mcp@localhost:5432/context_use
          PUBLIC_DATABASE_URL: postgres://context_use_public:test-public@localhost:5432/context_use
          CONFIRMATION_DATABASE_URL: postgres://context_use_confirmation:test-confirmation@localhost:5432/context_use
          OWNER_EMAIL: owner@example.com
          OWNER_SETUP_TOKEN_HASH: 0c3f0f8b90068b05d8039bf05db2da4742c31a23e51cfa864a96a0efe17b1694
        run: |
          bun run db:initialize
          bun run db:test mark
          bun test apps packages
      - run: bun --cwd apps/web build
      - name: Validate Terraform
        run: |
          terraform -chdir=infra/data init -backend=false
          terraform -chdir=infra/data validate
          terraform -chdir=infra/compute init -backend=false
          terraform -chdir=infra/compute validate
      - name: Validate Compose and Caddy
        env:
          VERSION: v0.1.1
          APP_IMAGE: ghcr.io/massimoalbarello/context-use@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BACKUP_IMAGE: ghcr.io/massimoalbarello/context-use-backup@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          NANGO_IMAGE: ghcr.io/massimoalbarello/context-use-nango@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          OAUTH2_PROXY_IMAGE: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2@sha256:aa0bd8dd5ab0c78e4c91c92755ad573a5f92241f88138b4141b8ec803463b4fd
          POSTGRES_PASSWORD: test
          DB_AUTH_PASSWORD: test
          DB_DASHBOARD_PASSWORD: test
          DB_MCP_PASSWORD: test
          DB_PUBLIC_PASSWORD: test
          DB_CONFIRMATION_PASSWORD: test
          DB_STORAGE_PASSWORD: test
          DB_BACKUP_PASSWORD: test
          NANGO_DB_PASSWORD: test-nango-database
          NANGO_BACKUP_DB_PASSWORD: test-nango-backup
          NANGO_ENCRYPTION_KEY: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0
          NANGO_ADMIN_KEY: test-test-test-test-nango-admin-key
          NANGO_DASHBOARD_USERNAME: owner@example.com
          NANGO_DASHBOARD_PASSWORD: test-test-test-test-nango-dashboard
          NANGO_DASHBOARD_BASIC: b3duZXJAZXhhbXBsZS5jb206dGVzdA==
          NANGO_OAUTH_CLIENT_ID: context-use-nango-dashboard
          NANGO_OAUTH_CLIENT_SECRET: test-test-test-test-nango-oauth-client-secret
          NANGO_AUTH_COOKIE_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_HOSTNAME: context.example.com
          ASSET_HOSTNAME: assets.context.example.com
          NANGO_HOSTNAME: nango.context.example.com
          APP_ORIGIN: http://localhost:5173
          NANGO_ORIGIN: http://localhost:5174
          APP_PORT: "5173"
          NANGO_PORT: "5174"
          OWNER_EMAIL: owner@example.com
          OWNER_SETUP_TOKEN_HASH: 0c3f0f8b90068b05d8039bf05db2da4742c31a23e51cfa864a96a0efe17b1694
          BETTER_AUTH_SECRET: test-test-test-test-test-test-test-test
          MCP_ASSET_CAPABILITY_SECRET: test-test-test-test-test-test-mcp-secret
          CONFIRMATION_GATEWAY_TOKEN: test-test-test-test-confirmation-gateway
          AUTH_DASHBOARD_TOKEN: test-test-test-test-dashboard-auth-gateway
          AUTH_MCP_TOKEN: test-test-test-test-private-mcp-auth-gateway
          AUTH_NANGO_TOKEN: test-test-test-test-nango-auth-gateway
          CONFIRMATION_DASHBOARD_TOKEN: test-test-test-dashboard-confirmation
          STORAGE_DASHBOARD_TOKEN: test-test-test-test-storage-dashboard
          STORAGE_MCP_TOKEN: test-test-test-test-storage-private-mcp
          STORAGE_PUBLIC_TOKEN: test-test-test-test-storage-public-web
          AWS_REGION: eu-west-2
          ASSET_BUCKET: test-assets
          BACKUP_BUCKET: test-backups
          KMS_KEY_ID: test
          CLOUDWATCH_LOG_GROUP: test
          STORAGE_ROLE_ARN: arn:aws:iam::123456789012:role/context-use-test-storage
          BACKUP_ROLE_ARN: arn:aws:iam::123456789012:role/context-use-test-backup
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/compose-env.sh deploy/validate-compose-env.sh
          bash deploy/validate-compose-env.sh deploy
          sh -n deploy/validate-nango-edge.sh
          sh deploy/validate-nango-edge.sh deploy
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/compose.local.yml config --quiet
          for caddyfile in Caddyfile Caddyfile.nango-auth Caddyfile.nango-public Caddyfile.local; do
            docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,size=8m \
              --tmpfs /data:rw,noexec,nosuid,size=8m \
              --tmpfs /config:rw,noexec,nosuid,size=8m \
              -v "$PWD/deploy/${caddyfile}:/etc/caddy/Caddyfile:ro" \
              -e APP_HOSTNAME=context.example.com \
              -e ASSET_HOSTNAME=assets.context.example.com \
              -e NANGO_HOSTNAME=nango.context.example.com \
              -e AUTH_NANGO_TOKEN=validation-only \
              -e NANGO_DASHBOARD_BASIC=dmFsaWRhdGlvbjpvbmx5 \
              caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
              caddy validate --config /etc/caddy/Caddyfile
          done
          sh deploy/probe-nango-public-edge.sh deploy
          printf '%s\n' owner@example.com > "$RUNNER_TEMP/nango-owner-email"
          compose_json="$(docker compose -f deploy/docker-compose.yml config --format json)"
          oauth2_proxy_image="$(jq -r '.services["oauth2-proxy"].image' <<<"$compose_json")"
          oauth2_proxy_env=()
          while IFS= read -r entry; do
            oauth2_proxy_env+=(--env "$entry")
          done < <(jq -r '.services["oauth2-proxy"].environment | to_entries[] | "\(.key)=\(.value)"' <<<"$compose_json")
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            "${oauth2_proxy_env[@]}" \
            -e OAUTH2_PROXY_SESSION_STORE_TYPE=cookie \
            -e OAUTH2_PROXY_REDIS_CONNECTION_URL= \
            -v "$RUNNER_TEMP/nango-owner-email:/etc/oauth2-proxy/authorized-emails:ro" \
            "$oauth2_proxy_image" --config-test
      - run: docker build -t context-use:test .
      - run: docker build -f deploy/backup/Dockerfile -t context-use-backup:test .
      - name: Verify Nango database role isolation
        run: |
          docker run --rm --network host --entrypoint /usr/local/bin/context-use-nango-db-init \
            -e PGHOST=127.0.0.1 \
            -e POSTGRES_PASSWORD=postgres \
            -e NANGO_DB_PASSWORD=test-nango-app \
            -e NANGO_BACKUP_DB_PASSWORD=test-nango-backup \
            context-use-backup:test
          docker run --rm --network host --entrypoint /usr/local/bin/context-use-nango-db-init \
            -e PGHOST=127.0.0.1 \
            -e POSTGRES_PASSWORD=postgres \
            -e NANGO_DB_PASSWORD=test-nango-app \
            -e NANGO_BACKUP_DB_PASSWORD=test-nango-backup \
            context-use-backup:test
          docker run --rm --network host --entrypoint psql \
            -e PGPASSWORD=test-nango-app \
            context-use-backup:test -h 127.0.0.1 -U nango_app -d nango \
            -v ON_ERROR_STOP=1 -c "CREATE TABLE public.context_use_ci_probe (id bigint PRIMARY KEY); INSERT INTO public.context_use_ci_probe VALUES (1)"
          docker run --rm --network host --entrypoint psql \
            -e PGPASSWORD=test-nango-backup \
            context-use-backup:test -h 127.0.0.1 -U nango_backup -d nango \
            -v ON_ERROR_STOP=1 -c "SELECT id FROM public.context_use_ci_probe"
          if docker run --rm --network host --entrypoint psql \
            -e PGPASSWORD=test-nango-backup \
            context-use-backup:test -h 127.0.0.1 -U nango_backup -d nango \
            -v ON_ERROR_STOP=1 -c "INSERT INTO public.context_use_ci_probe VALUES (2)"; then
            echo "nango_backup unexpectedly mutated Nango data" >&2
            exit 1
          fi
          if docker run --rm --network host --entrypoint psql \
            -e PGPASSWORD=test-nango-app \
            context-use-backup:test -h 127.0.0.1 -U nango_app -d context_use \
            -v ON_ERROR_STOP=1 -c "SELECT 1"; then
            echo "nango_app unexpectedly connected to the Context Use database" >&2
            exit 1
          fi
