name: Sync Nango submodule

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-nango-submodule
  cancel-in-progress: false

env:
  NANGO_REPOSITORY: massimoalbarello/nango
  NANGO_BRANCH: context-use
  UPDATE_BRANCH: codex/update-nango

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: recursive

      - id: update
        name: Update the pinned commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          old_sha="$(git -C nango rev-parse HEAD)"
          git -C nango fetch --no-tags --depth=1 origin "${NANGO_BRANCH}"
          new_sha="$(git -C nango rev-parse FETCH_HEAD)"

          echo "old_sha=${old_sha}" >> "$GITHUB_OUTPUT"
          echo "new_sha=${new_sha}" >> "$GITHUB_OUTPUT"

          if [ "$old_sha" = "$new_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compare_status="$(gh api \
            "repos/${NANGO_REPOSITORY}/compare/${old_sha}...${new_sha}" \
            --jq '.status')"
          if [ "$compare_status" != "ahead" ]; then
            echo "::error::Refusing a non-fast-forward Nango update from ${old_sha} to ${new_sha}."
            exit 1
          fi

          if git fetch --no-tags origin \
            "${UPDATE_BRANCH}:refs/remotes/origin/${UPDATE_BRANCH}"; then
            proposed_sha="$(git ls-tree "origin/${UPDATE_BRANCH}" -- nango | awk '{print $3}')"
            if [ "$proposed_sha" = "$new_sha" ]; then
              git switch -C "${UPDATE_BRANCH}" "origin/${UPDATE_BRANCH}"
              git -C nango checkout --detach "$new_sha"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "push_required=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git switch -C "${UPDATE_BRANCH}"
          git -C nango checkout --detach "$new_sha"
          git add nango
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(nango): update submodule to ${new_sha:0:12}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "push_required=true" >> "$GITHUB_OUTPUT"

      - name: Set up the Nango image builder
        if: steps.update.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Validate the updated production image
        if: steps.update.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./nango
          file: ./nango/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: git_hash=${{ steps.update.outputs.new_sha }}
          cache-from: type=gha,scope=nango
          cache-to: type=gha,mode=max,scope=nango

      - name: Publish the validated update branch
        if: steps.update.outputs.push_required == 'true'
        run: git push --force-with-lease origin "${UPDATE_BRANCH}"

      - name: Open the update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          OLD_SHA: ${{ steps.update.outputs.old_sha }}
          NEW_SHA: ${{ steps.update.outputs.new_sha }}
        run: |
          pr_url="$(gh pr list \
            --head "${UPDATE_BRANCH}" \
            --base "${BASE_BRANCH}" \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [ -z "$pr_url" ]; then
            body="$(printf '%s\n\n%s\n\n%s' \
              "Updates the pinned Nango source from \`${OLD_SHA}\` to \`${NEW_SHA}\`." \
              "Source comparison: https://github.com/${NANGO_REPOSITORY}/compare/${OLD_SHA}...${NEW_SHA}" \
              "Tagged Context Use releases will continue to build this exact gitlink, never the moving \`${NANGO_BRANCH}\` branch.")"
            pr_url="$(gh pr create \
              --head "${UPDATE_BRANCH}" \
              --base "${BASE_BRANCH}" \
              --title "chore(nango): update pinned submodule" \
              --body "$body")"
          fi

          echo "Nango update pull request: ${pr_url}"
