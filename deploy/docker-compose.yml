name: context-use

x-locked-service: &locked-service
  image: ${APP_IMAGE}
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${CLOUDWATCH_LOG_GROUP}

x-nango-environment: &nango-environment
  NODE_ENV: production
  NANGO_ENTERPRISE: "true"
  NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}
  NANGO_DB_HOST: postgres
  NANGO_DB_PORT: "5432"
  NANGO_DB_NAME: nango
  NANGO_DB_USER: nango_app
  NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD}
  NANGO_DB_SSL: "false"
  NANGO_DB_SCHEMA: nango
  NANGO_DB_POOL_MIN: "0"
  NANGO_DB_POOL_MAX: "4"
  RECORDS_DATABASE_URL: postgres://nango_app:${NANGO_DB_PASSWORD}@postgres:5432/nango
  RECORDS_DATABASE_SCHEMA: nango_records
  RECORDS_DATABASE_POOL_MIN: "0"
  RECORDS_DATABASE_POOL_MAX: "4"
  ORCHESTRATOR_SERVICE_URL: http://nango-orchestrator:3008
  PERSIST_SERVICE_URL: http://nango-persist:3007
  JOBS_SERVICE_URL: http://nango-jobs:3005
  ORCHESTRATOR_DB_POOL_MAX: "4"
  TASKS_DB_POOL_MAX: "3"
  FLEET_DB_POOL_MAX: "2"
  NANGO_REDIS_URL: redis://nango-redis:6379
  NANGO_LOGS_ENABLED: "false"
  # Context Use does not run a Datadog agent. Load dd-trace's no-op proxy at
  # process start so public propagation headers cannot activate tracing.
  DD_TRACE_ENABLED: "false"
  # Nango's optional OTLP export does not need inbound cross-system context.
  # An unregistered value makes its SDK install no global propagator.
  OTEL_PROPAGATORS: none
  PERSIST_AUTO_PRUNING_INTERVAL_MS: "0"
  PERSIST_AUTO_DELETING_INTERVAL_MS: "0"
  LOG_LEVEL: info

x-nango-service: &nango-service
  image: ${NANGO_IMAGE}
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 512

x-nango-gateway: &nango-gateway
  image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=8m,mode=1777
    - /data:size=8m,mode=0700
    - /config:size=8m,mode=0700
  cap_drop: [ALL]
  # The official binary carries cap_net_bind_service as a file capability and
  # cannot be executed when that capability is absent from the bounding set.
  cap_add: [NET_BIND_SERVICE]
  security_opt: [no-new-privileges:true]
  pids_limit: 64

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: context_use
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "listen_addresses=*", "-c", "max_connections=150"]
    volumes: [/data/context-use/postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d context_use"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [migration_data, dashboard_data, auth_data, mcp_data, public_data, confirmation_data, storage_data, backup_data, nango_data]
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: postgres

  migrate:
    image: ${APP_IMAGE}
    profiles: [migration]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      MIGRATOR_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/context_use
      DATABASE_URL: postgres://context_use_dashboard:${DB_DASHBOARD_PASSWORD}@postgres:5432/context_use
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD}
      DB_DASHBOARD_PASSWORD: ${DB_DASHBOARD_PASSWORD}
      DB_MCP_PASSWORD: ${DB_MCP_PASSWORD}
      DB_PUBLIC_PASSWORD: ${DB_PUBLIC_PASSWORD}
      DB_CONFIRMATION_PASSWORD: ${DB_CONFIRMATION_PASSWORD}
      DB_STORAGE_PASSWORD: ${DB_STORAGE_PASSWORD}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD}
      CONTEXT_USE_TEMPLATE_INSTALL: ${CONTEXT_USE_TEMPLATE_INSTALL:-}
    command: ["bun", "packages/database/src/initialize.ts"]
    networks: [migration_data]

  nango-db-init:
    image: ${BACKUP_IMAGE}
    profiles: [nango-init]
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/usr/local/bin/context-use-nango-db-init"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD}
      NANGO_BACKUP_DB_PASSWORD: ${NANGO_BACKUP_DB_PASSWORD}
    networks: [migration_data, nango_data]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64

  nango-redis:
    image: redis:8.8.0@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [nango_internal]
    read_only: true
    tmpfs: ["/data:size=64m,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: nango-redis

  nango-orchestrator:
    <<: *nango-service
    depends_on:
      postgres: { condition: service_healthy }
      nango-redis: { condition: service_healthy }
    environment:
      <<: *nango-environment
      NANGO_DB_APPLICATION_NAME: context-use-nango-orchestrator
      NANGO_ORCHESTRATOR_PORT: "3008"
    command: ["node", "packages/orchestrator/dist/app.js"]
    networks: [nango_data, nango_internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: nango-orchestrator

  nango-persist:
    <<: *nango-service
    depends_on:
      postgres: { condition: service_healthy }
      nango-redis: { condition: service_healthy }
    environment:
      <<: *nango-environment
      NANGO_DB_APPLICATION_NAME: context-use-nango-persist
      NANGO_PERSIST_PORT: "3007"
    command: ["node", "packages/persist/dist/app.js"]
    networks: [nango_data, nango_internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: nango-persist

  nango-server:
    <<: *nango-service
    depends_on:
      postgres: { condition: service_healthy }
      nango-redis: { condition: service_healthy }
    environment:
      <<: *nango-environment
      NANGO_DB_APPLICATION_NAME: context-use-nango-server
      SERVER_PORT: "3003"
      NANGO_MIGRATE_AT_START: "true"
      NANGO_SERVER_URL: https://${NANGO_HOSTNAME}
      NANGO_PUBLIC_SERVER_URL: https://${NANGO_HOSTNAME}
      NANGO_PUBLIC_CONNECT_URL: https://${NANGO_HOSTNAME}/connect-ui
      NANGO_ADMIN_KEY: ${NANGO_ADMIN_KEY}
      FLAG_AUTH_ENABLED: "false"
      AUTH_ALLOW_SIGNUP: "false"
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD}
      FLAG_SERVE_CONNECT_UI: "true"
      NANGO_CONNECT_UI_PORT: "3009"
      NANGO_SERVER_WEBSOCKETS_PATH: /connect/ws
      CSP_REPORT_ONLY: "false"
    command: ["packages/server/entrypoint.sh"]
    volumes:
      - /data/context-use/nango-integrations:/app/nango/packages/shared/dist/nango-integrations
    networks:
      - nango_data
      - nango_internal
      - nango_pipeline_internal
      - nango_management_internal
      - nango_public_upstream
      - nango_auth_upstream
      - nango_egress
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 60
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: nango-server

  # OAuth2 Proxy stores only an opaque ticket in the browser. Its tokens live
  # in this non-published Redis, whose network has no other peer.
  nango-sso-redis:
    image: redis:8.8.0@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [nango_sso_store]
    read_only: true
    tmpfs: ["/data:size=64m,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: nango-sso-redis

  oauth2-proxy:
    image: ${OAUTH2_PROXY_IMAGE}
    restart: unless-stopped
    depends_on:
      auth: { condition: service_healthy }
      nango-sso-redis: { condition: service_healthy }
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Context Use passkey
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://${APP_HOSTNAME}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: https://${APP_HOSTNAME}/api/auth/oauth2/authorize
      OAUTH2_PROXY_REDEEM_URL: http://auth:3002/api/auth/oauth2/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://auth:3002/api/auth/jwks
      OAUTH2_PROXY_OIDC_ENABLED_SIGNING_ALGS: EdDSA
      OAUTH2_PROXY_SKIP_CLAIMS_FROM_PROFILE_URL: "true"
      OAUTH2_PROXY_CLIENT_ID: ${NANGO_OAUTH_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${NANGO_OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://${NANGO_HOSTNAME}/_context-use-auth/callback
      OAUTH2_PROXY_SCOPE: openid email
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_NONCE: "false"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "false"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/authorized-emails
      OAUTH2_PROXY_PROXY_PREFIX: /_context-use-auth
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: 172.30.254.2/32,172.30.254.11/32
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${NANGO_HOSTNAME}
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://nango-sso-redis:6379/0
      OAUTH2_PROXY_COOKIE_NAME: __Host-context-use-nango
      OAUTH2_PROXY_COOKIE_SECRET: ${NANGO_AUTH_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: strict
      OAUTH2_PROXY_COOKIE_PATH: /
      OAUTH2_PROXY_COOKIE_EXPIRE: 10m
      OAUTH2_PROXY_COOKIE_REFRESH: "0"
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST_LIMIT: "8"
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: 5m
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "false"
      OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "false"
      OAUTH2_PROXY_SKIP_AUTH_PREFLIGHT: "false"
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "false"
      OAUTH2_PROXY_PROXY_WEBSOCKETS: "false"
      OAUTH2_PROXY_REQUEST_LOGGING: "false"
      OAUTH2_PROXY_AUTH_LOGGING: "false"
      OAUTH2_PROXY_STANDARD_LOGGING: "true"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
      OAUTH2_PROXY_SHOW_DEBUG_ON_ERROR: "false"
    volumes:
      - /data/context-use/secrets/nango-owner-email:/etc/oauth2-proxy/authorized-emails:ro
    networks:
      nango_oauth_browser:
        ipv4_address: 172.30.254.3
      nango_sso_internal:
        ipv4_address: 172.30.254.10
      nango_sso_store: {}
      auth_nango_internal: {}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    healthcheck:
      # The pinned image is distroless, so there is no HTTP client. This checks
      # option validity; nango-auth-gateway's healthcheck below calls /ready to
      # verify the live listener and isolated Redis session store.
      test: ["CMD", "/bin/oauth2-proxy", "--config-test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: oauth2-proxy

  # This gateway has no credentials. Its Caddyfile independently allowlists
  # exact public callback/webhook/Connect route+method combinations.
  nango-public-gateway:
    <<: *nango-gateway
    depends_on:
      nango-server: { condition: service_healthy }
    environment:
      NANGO_HOSTNAME: ${NANGO_HOSTNAME}
    volumes:
      - ./Caddyfile.nango-public:/etc/caddy/Caddyfile:ro
    networks: [nango_public_edge, nango_public_upstream]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:3000/healthz &&
          wget -q -O /dev/null http://nango-server:3003/ready
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: nango-public-gateway

  # This is the only edge-adjacent service that knows Nango's Basic
  # capability. It must pass both SSO and live Context authorization first.
  nango-auth-gateway:
    <<: *nango-gateway
    depends_on:
      auth: { condition: service_healthy }
      nango-server: { condition: service_healthy }
      oauth2-proxy: { condition: service_healthy }
    environment:
      NANGO_HOSTNAME: ${NANGO_HOSTNAME}
      NANGO_DASHBOARD_BASIC: ${NANGO_DASHBOARD_BASIC}
      AUTH_NANGO_TOKEN: ${AUTH_NANGO_TOKEN}
    volumes:
      - ./Caddyfile.nango-auth:/etc/caddy/Caddyfile:ro
    networks:
      nango_auth_edge: {}
      nango_auth_upstream: {}
      nango_sso_internal:
        ipv4_address: 172.30.254.11
      auth_nango_internal: {}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:3000/healthz &&
          wget -q -O /dev/null http://oauth2-proxy:4180/ready &&
          wget -q -O /dev/null http://auth:3002/health &&
          wget -q -O /dev/null http://nango-server:3003/ready
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: nango-auth-gateway

  nango-jobs:
    <<: *nango-service
    depends_on:
      postgres: { condition: service_healthy }
      nango-redis: { condition: service_healthy }
      nango-orchestrator: { condition: service_healthy }
      nango-persist: { condition: service_healthy }
      nango-server: { condition: service_healthy }
    environment:
      <<: *nango-environment
      NANGO_DB_APPLICATION_NAME: context-use-nango-jobs
      NANGO_JOBS_PORT: "3005"
      NANGO_SERVER_URL: http://nango-server:3003
      SERVER_SERVICE_URL: http://nango-server:3003
      PROVIDERS_URL: http://nango-server:3003/providers.json
      RUNNER_TYPE: LOCAL
      NANGO_RUNNER_PATH: /app/nango/packages/runner/dist/app.js
    command: ["node", "packages/jobs/dist/app.js"]
    volumes:
      - /data/context-use/nango-integrations:/app/nango/packages/shared/dist/nango-integrations
    networks: [nango_data, nango_internal, nango_egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 60
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: nango-jobs

  dashboard-edge:
    <<: *locked-service
    depends_on:
      app: { condition: service_healthy }
    environment:
      NODE_ENV: production
      SERVICE_MODE: dashboard-edge
      PORT: "3007"
      APP_ORIGIN: https://${APP_HOSTNAME}
      ASSET_ORIGIN: https://${ASSET_HOSTNAME}
      DASHBOARD_AUTHORITY_URL: http://app:3000
    command: ["bun", "apps/server/src/dashboard-edge-index.ts"]
    networks: [dashboard_web, dashboard_edge_internal]
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://localhost:3007/health'); if (!response.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: dashboard-edge

  app:
    <<: *locked-service
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_healthy }
      confirmation: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      NODE_ENV: production
      SERVICE_MODE: dashboard
      PORT: "3000"
      APP_ORIGIN: https://${APP_HOSTNAME}
      ASSET_ORIGIN: https://${ASSET_HOSTNAME}
      MCP_RESOURCE: https://${APP_HOSTNAME}/mcp
      DATABASE_URL: postgres://context_use_dashboard:${DB_DASHBOARD_PASSWORD}@postgres:5432/context_use
      AUTH_INTERNAL_URL: http://auth:3002
      CONFIRMATION_INTERNAL_URL: http://confirmation:3004
      AUTH_DASHBOARD_TOKEN: ${AUTH_DASHBOARD_TOKEN}
      CONFIRMATION_DASHBOARD_TOKEN: ${CONFIRMATION_DASHBOARD_TOKEN}
      STORAGE_SOCKET_PATH: /run/context-use-storage/storage.sock
      STORAGE_DASHBOARD_TOKEN: ${STORAGE_DASHBOARD_TOKEN}
      NANGO_PUBLIC_URL: https://${NANGO_HOSTNAME}
      NANGO_IMAGE_REFERENCE: ${NANGO_IMAGE}
      WEB_DIST: /app/apps/web/dist
    command: ["bun", "apps/server/src/dashboard-index.ts"]
    volumes: [storage-socket:/run/context-use-storage:ro]
    networks: [dashboard_data, dashboard_edge_internal, auth_dashboard_internal, confirmation_internal]
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://localhost:3000/api/health'); if (!response.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: dashboard

  auth:
    <<: *locked-service
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      SERVICE_MODE: auth
      PORT: "3002"
      APP_ORIGIN: https://${APP_HOSTNAME}
      ASSET_ORIGIN: https://${ASSET_HOSTNAME}
      OAUTH_ISSUER: https://${APP_HOSTNAME}
      MCP_RESOURCE: https://${APP_HOSTNAME}/mcp
      NANGO_ORIGIN: https://${NANGO_HOSTNAME}
      WEBAUTHN_RP_ID: ${APP_HOSTNAME}
      WEBAUTHN_RP_NAME: context-use
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_SETUP_TOKEN_HASH: ${OWNER_SETUP_TOKEN_HASH}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AUTH_DASHBOARD_TOKEN: ${AUTH_DASHBOARD_TOKEN}
      AUTH_MCP_TOKEN: ${AUTH_MCP_TOKEN}
      AUTH_NANGO_TOKEN: ${AUTH_NANGO_TOKEN}
      NANGO_OAUTH_CLIENT_ID: ${NANGO_OAUTH_CLIENT_ID}
      NANGO_OAUTH_CLIENT_SECRET: ${NANGO_OAUTH_CLIENT_SECRET}
      CONFIRMATION_INTERNAL_URL: http://confirmation:3004
      CONFIRMATION_GATEWAY_TOKEN: ${CONFIRMATION_GATEWAY_TOKEN}
      AUTH_DATABASE_URL: postgres://context_use_auth:${DB_AUTH_PASSWORD}@postgres:5432/context_use
    command: ["bun", "apps/server/src/auth-index.ts"]
    networks: [auth_data, auth_web, auth_dashboard_internal, auth_mcp_internal, auth_confirmation_internal, auth_nango_internal]
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://localhost:3002/health'); if (!response.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: auth

  private-mcp:
    <<: *locked-service
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      NODE_ENV: production
      SERVICE_MODE: mcp
      PORT: "3003"
      APP_ORIGIN: https://${APP_HOSTNAME}
      ASSET_ORIGIN: https://${ASSET_HOSTNAME}
      OAUTH_ISSUER: https://${APP_HOSTNAME}
      MCP_RESOURCE: https://${APP_HOSTNAME}/mcp
      MCP_DATABASE_URL: postgres://context_use_mcp:${DB_MCP_PASSWORD}@postgres:5432/context_use
      AUTH_INTERNAL_URL: http://auth:3002
      AUTH_MCP_TOKEN: ${AUTH_MCP_TOKEN}
      MCP_ASSET_CAPABILITY_SECRET: ${MCP_ASSET_CAPABILITY_SECRET}
      STORAGE_SOCKET_PATH: /run/context-use-storage/storage.sock
      STORAGE_MCP_TOKEN: ${STORAGE_MCP_TOKEN}
      NANGO_INTERNAL_URL: http://nango-server:3003
      NANGO_PIPELINE_API_KEY: ${NANGO_PIPELINE_API_KEY:-}
    command: ["bun", "apps/server/src/mcp-index.ts"]
    volumes: [storage-socket:/run/context-use-storage:ro]
    networks: [mcp_data, mcp_web, auth_mcp_internal, nango_pipeline_internal]
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://localhost:3003/health'); if (!response.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: private-mcp

  public-web:
    <<: *locked-service
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      NODE_ENV: production
      SERVICE_MODE: public
      PORT: "3005"
      APP_ORIGIN: https://${APP_HOSTNAME}
      ASSET_ORIGIN: https://${ASSET_HOSTNAME}
      PUBLIC_DATABASE_URL: postgres://context_use_public:${DB_PUBLIC_PASSWORD}@postgres:5432/context_use
      STORAGE_SOCKET_PATH: /run/context-use-storage/storage.sock
      STORAGE_PUBLIC_TOKEN: ${STORAGE_PUBLIC_TOKEN}
    command: ["bun", "apps/server/src/public-index.ts"]
    volumes: [storage-socket:/run/context-use-storage:ro]
    networks: [public_data, public_web]
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://localhost:3005/health'); if (!response.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: public-web

  confirmation:
    <<: *locked-service
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      SERVICE_MODE: confirmation
      PORT: "3004"
      APP_ORIGIN: https://${APP_HOSTNAME}
      ASSET_ORIGIN: https://${ASSET_HOSTNAME}
      WEBAUTHN_RP_ID: ${APP_HOSTNAME}
      CONFIRMATION_DATABASE_URL: postgres://context_use_confirmation:${DB_CONFIRMATION_PASSWORD}@postgres:5432/context_use
      CONFIRMATION_GATEWAY_TOKEN: ${CONFIRMATION_GATEWAY_TOKEN}
      CONFIRMATION_DASHBOARD_TOKEN: ${CONFIRMATION_DASHBOARD_TOKEN}
    command: ["bun", "apps/server/src/confirmation-index.ts"]
    networks: [confirmation_data, auth_confirmation_internal, confirmation_internal]
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://localhost:3004/health'); if (!response.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: confirmation

  storage-socket-init:
    image: ${APP_IMAGE}
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    command: ["sh", "-c", "chown root:root /run/context-use-storage && chmod 0700 /run/context-use-storage && chown bun:bun /run/context-use-storage"]
    volumes: [storage-socket:/run/context-use-storage]

  aws-credential-broker:
    image: ${BACKUP_IMAGE}
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/usr/local/bin/context-use-aws-credential-broker"]
    environment:
      AWS_REGION: ${AWS_REGION}
      STORAGE_ROLE_ARN: ${STORAGE_ROLE_ARN}
      BACKUP_ROLE_ARN: ${BACKUP_ROLE_ARN}
    volumes:
      - storage-aws-credentials:/run/context-use-aws-storage
      - backup-aws-credentials:/run/context-use-aws-backup
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/context-use-aws-storage/credentials.json && test -s /run/context-use-aws-backup/credentials.json"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: aws-credential-broker

  storage:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      storage-socket-init: { condition: service_completed_successfully }
      aws-credential-broker: { condition: service_healthy }
    environment:
      NODE_ENV: production
      SERVICE_MODE: storage
      APP_ORIGIN: https://${APP_HOSTNAME}
      ASSET_ORIGIN: https://${ASSET_HOSTNAME}
      STORAGE_DATABASE_URL: postgres://context_use_storage:${DB_STORAGE_PASSWORD}@postgres:5432/context_use
      STORAGE_DRIVER: s3
      STORAGE_SOCKET_PATH: /run/context-use-storage/storage.sock
      STORAGE_DASHBOARD_TOKEN: ${STORAGE_DASHBOARD_TOKEN}
      STORAGE_MCP_TOKEN: ${STORAGE_MCP_TOKEN}
      STORAGE_PUBLIC_TOKEN: ${STORAGE_PUBLIC_TOKEN}
      AWS_REGION: ${AWS_REGION}
      AWS_CREDENTIALS_FILE: /run/context-use-aws-storage/credentials.json
      AWS_EC2_METADATA_DISABLED: "true"
      ASSET_BUCKET: ${ASSET_BUCKET}
      KMS_KEY_ID: ${KMS_KEY_ID}
    command: ["bun", "apps/server/src/storage-index.ts"]
    volumes:
      - storage-socket:/run/context-use-storage
      - storage-aws-credentials:/run/context-use-aws-storage:ro
    networks: [storage_data, storage_egress]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    healthcheck:
      test: ["CMD", "bun", "-e", "const http=require('node:http');const request=http.request({socketPath:'/run/context-use-storage/storage.sock',path:'/health'},response=>process.exit(response.statusCode===200?0:1));request.on('error',()=>process.exit(1));request.end()"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: storage

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      dashboard-edge: { condition: service_healthy }
      auth: { condition: service_healthy }
      private-mcp: { condition: service_healthy }
      public-web: { condition: service_healthy }
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME}
      ASSET_HOSTNAME: ${ASSET_HOSTNAME}
      NANGO_HOSTNAME: ${NANGO_HOSTNAME}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/context-use/caddy/data:/data
      - /data/context-use/caddy/config:/config
    networks:
      edge: {}
      dashboard_web: {}
      auth_web: {}
      mcp_web: {}
      public_web: {}
      nango_public_edge: {}
      nango_auth_edge: {}
      nango_oauth_browser:
        ipv4_address: 172.30.254.2
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: caddy

  backup:
    image: ${BACKUP_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      aws-credential-broker: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: context_use
      PGUSER: context_use_backup
      PGPASSWORD: ${DB_BACKUP_PASSWORD}
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      KMS_KEY_ID: ${KMS_KEY_ID}
      VERSION: ${VERSION}
      SCHEMA_VERSION: 001_baseline.sql
      AWS_REGION: ${AWS_REGION}
      AWS_CONFIG_FILE: /etc/context-use/aws-config
      AWS_PROFILE: context-use-backup
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - backup-aws-credentials:/run/context-use-aws-backup:ro
      - /data/context-use/backup-tmp:/tmp
    networks: [backup_data, backup_egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: backup

  nango-backup:
    image: ${BACKUP_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      aws-credential-broker: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: nango
      PGUSER: nango_backup
      PGPASSWORD: ${NANGO_BACKUP_DB_PASSWORD}
      BACKUP_KIND: nango
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      KMS_KEY_ID: ${KMS_KEY_ID}
      VERSION: ${VERSION}
      SCHEMA_VERSION: nango-managed
      AWS_REGION: ${AWS_REGION}
      AWS_CONFIG_FILE: /etc/context-use/aws-config
      AWS_PROFILE: context-use-backup
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - backup-aws-credentials:/run/context-use-aws-backup:ro
      - /data/context-use/nango-backup-tmp:/tmp
    networks: [nango_data, backup_egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging:
      <<: *logging
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP}
        awslogs-stream: nango-backup

volumes:
  storage-socket:
  storage-aws-credentials:
  backup-aws-credentials:

networks:
  edge: {}
  dashboard_web: { internal: true }
  dashboard_edge_internal: { internal: true }
  auth_web: { internal: true }
  mcp_web: { internal: true }
  public_web: { internal: true }
  auth_dashboard_internal: { internal: true }
  auth_mcp_internal: { internal: true }
  auth_confirmation_internal: { internal: true }
  confirmation_internal: { internal: true }
  migration_data: { internal: true }
  dashboard_data: { internal: true }
  auth_data: { internal: true }
  mcp_data: { internal: true }
  public_data: { internal: true }
  confirmation_data: { internal: true }
  storage_data: { internal: true }
  backup_data: { internal: true }
  nango_data: { internal: true }
  nango_internal: { internal: true }
  nango_pipeline_internal: { internal: true }
  nango_management_internal: { internal: true }
  nango_public_edge: { internal: true }
  nango_public_upstream: { internal: true }
  nango_auth_edge: { internal: true }
  nango_auth_upstream: { internal: true }
  auth_nango_internal: { internal: true }
  nango_sso_store: { internal: true }
  nango_oauth_browser:
    internal: true
    ipam:
      config:
        - subnet: 172.30.254.0/29
  nango_sso_internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.254.8/29
  storage_egress: {}
  backup_egress: {}
  nango_egress: {}
